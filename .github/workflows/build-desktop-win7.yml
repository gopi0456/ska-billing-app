name: Build Windows 7 EXE

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/build-desktop-win7.yml' # Prevent infinite loop on self-edit
  workflow_dispatch: # Allow manual trigger

jobs:
  build-win7-exe:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ./desktop-config
        run: npm install

      - name: Prepare Web Assets
        # Ensure the 'www' folder exists for the builder to find
        run: |
          mkdir -p www
          cp -r android/app/src/main/assets/public/* www/ || echo "Warning: Could not copy assets, checking if www already exists..."
        shell: bash

      - name: Build Electron App (IA32 for Win7)
        working-directory: ./desktop-config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win7

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKA-Billing-Win7-Portable
          path: ./dist-desktop/*.exe
          retention-days: 30
