name: Build Windows 7 EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Compatible with Electron 22 build tools

      - name: Install dependencies
        run: npm install

      - name: Build for Windows 7 (ia32)
        run: npm run build:win7

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ska-billing-win7-installer
          path: dist-desktop/*.exe
