name: Build Windows 7 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win7-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare Web Assets INTO desktop-config/dist-web
        shell: bash
        run: |
          mkdir -p desktop-config/dist-web
          if [ -d android/app/src/main/assets/public ]; then
            cp -r android/app/src/main/assets/public/* desktop-config/dist-web/
          elif [ -d src ]; then
            cp -r src/* desktop-config/dist-web/
          fi
          echo "---- dist-web contents ----"
          ls -la desktop-config/dist-web
          test -f desktop-config/dist-web/index.html || { echo "FATAL: index.html missing in dist-web"; exit 1; }

      - name: Install Dependencies
        working-directory: ./desktop-config
        run: npm install

      - name: Build Electron App (IA32 for Win7)
        working-directory: ./desktop-config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win7

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKA-Billing-Win7-Portable
          path: dist-desktop/*.exe
          retention-days: 30
